    <!-- checkBox  bydefault checked  -->
    <form action="/server">
      <input type="checkbox" id="age" name="age" />
      <label for="age"> I am 18+ </label>
      <button>submit</button>
    </form>
    <hr />

    <!-- RADIO BUTTON -->
    <form action="/server">
      <div>
        <input type="radio" name="fruit" id="apple" value="apple" />
        <label for="apple">apple</label>
        <input type="radio" name="fruit" id="mango" value="mango" />
        <label for="mango">mango</label>
        <input type="radio" name="fruit" id="banana" value="banana" />
        <label for="banana">banana</label>
        <button>Submit</button>
      </div>
    </form>
    <hr />
    <form action="/server">
      <input type="checkbox" name="sub" id="math" value="math" />
      <label for="math">math</label>
      <input type="checkbox" name="sub" id="science" value="sci" />
      <label for="science">science</label>
      <input type="checkbox" name="sub" id="english" value="eng" />
      <label for="english">english</label>
      <button>Submit</button>
    </form>

    <!-- dropdown -->
    <hr />
    <form action="/profession">
      <select name="profession" id="profession">
        <option>Select your profession :</option>
        <option value="stu" selected>Student</option>
        <option value="dev">Developer</option>
        <option value="ops">DevOps</option>
      </select>
      <hr />

      <!-- Range -->
      <label for="vol">Select your volume level :</label>
      <input type="range" id="vol" name="vol" min="0" max="100" step="10" />

      <br />
      <!-- text area for any feedback and text -->
      <label for="feedback">Please give me your feedback :</label>
      <textarea name="feedback" id="feedback"></textarea>
      <button>submit</button>
    </form>
    <hr />

    <form action="/server">
      <h2>Registration Form</h2>
      <input type="text" placeholder="First Name" name="fname" />
      <input type="text" placeholder="Last Name" name="lname" />
      <br />
      <label for="gender">Please Select Gender :</label>
      <select name="gender" id="gender">
        <option value="m">Male</option>
        <option value="f">Female</option>
        <option value="o">Other</option>
      </select>
      <br />
      <div>
        Do you agree to all terms of service ?
        <input type="checkbox" id="agree" name="agree" />
        <label for="agree">Yes, I agree</label>
      </div>
      <button>Register</button>
    </form>
  </body>
